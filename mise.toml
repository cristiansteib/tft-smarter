[tools]
go = "latest"
python = "3"            # only needed by PlatformIO (pio)

[env]
TFT_PORT = "/dev/ttyACM0"

[tasks.build]
description = "Build the host monitor binary"
run = "go build -ldflags='-s -w' -o bin/tft-monitor ./cmd/tft-monitor"

[tasks.test]
description = "Go tests and the firmware build"
run = ["go vet ./...", "go test ./...", "pio run"]

[tasks.notify-install]
description = "Build tft-notify from source into ~/.local/bin (releases come from mise: see README) and install its skill"
run = ["go build -ldflags='-s -w' -o ~/.local/bin/tft-notify ./cmd/tft-notify", "~/.local/bin/tft-notify agents-install"]

[tasks.monitor]
description = "Stream PC stats to the TFT"
depends = ["build"]
run = "bin/tft-monitor -port $TFT_PORT"

[tasks.flash]
description = "Build the firmware and flash it (through the running tft-monitor, which owns the port)"
run = ["pio run", "go run ./cmd/tft-monitor flash -port $TFT_PORT -hex .pio/build/megaatmega2560/firmware.hex"]

[tasks.ui]
description = "Desktop app in dev mode (Tauri + Angular)"
dir = "desktop-ui"
run = "npm install && npm run app"

[tasks.ui-build]
description = "Build the desktop app binary"
dir = "desktop-ui"
run = "npm install && npm run app:build"
