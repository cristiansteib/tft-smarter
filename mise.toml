[tools]
go = "latest"
python = "3"            # only needed by PlatformIO (pio)

[env]
TFT_PORT = "/dev/ttyACM0"

[tasks.build]
description = "Build the host monitor binary"
run = "go build -ldflags='-s -w' -o bin/tft-monitor ./cmd/tft-monitor"

[tasks.notify-install]
description = "Install tft-notify into ~/.local/bin and its skill for coding agents"
run = ["go build -ldflags='-s -w' -o ~/.local/bin/tft-notify ./cmd/tft-notify", "~/.local/bin/tft-notify agents-install"]

[tasks.monitor]
description = "Stream PC stats to the TFT"
depends = ["build"]
run = "bin/tft-monitor -port $TFT_PORT"

[tasks.flash]
description = "Upload the firmware (stops the user service while flashing, then restarts it)"
run = ["systemctl --user stop tft-monitor || true", "pio run -t upload", "systemctl --user start tft-monitor || true"]

[tasks.ui]
description = "Desktop app in dev mode (Tauri + Angular)"
dir = "desktop-ui"
run = "npm install && npm run app"

[tasks.ui-build]
description = "Build the desktop app binary"
dir = "desktop-ui"
run = "npm install && npm run app:build"
