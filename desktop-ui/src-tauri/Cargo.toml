[package]
name = "tft-smarter-desktop"
version = "0.1.0"
description = "Desktop UI for the tft-monitor daemon"
edition = "2021"

[lib]
name = "tft_smarter_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
